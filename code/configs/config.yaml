experiment:
  name: swin_b_heads_prompt_fpn_task_type_plus_semantic
  seed: 42
  output_dir: outputs/new/prompt_fpn
  save_checkpoints: false
  checkpoint_freq: 10

data:
  root_path: "/proj/berzbiomedicalimagingkth/users/x_hujun/Foundation-Model-Challenge-for-Ultrasound-Image-Analysis/dataset/"
  val_split: 0.2
  batch_size: 32
  num_workers: 4
  pin_memory: true
  image_size: 256
  augmentation:
    train:
      random_brightness_contrast: 0.2
      gauss_noise: 0.1
      horizontal_flip: 0.0
      vertical_flip: 0.0
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
      # mean: [0.329834, 0.329834, 0.329834]  # 超声专用
      # std:  [0.178765, 0.178765, 0.178765]

model:
  moe:
    enabled: false
    num_experts: 8
    top_k: 1
    stage_indices: [3, 4]
    expert_hidden: 256
    router_hidden: 256
    balance_loss_weight: 0.05
    use_task_embedding: true
    task_embedding_dim: 64
    use_residual: true
    dropout: 0.0

  # encoder:
  #   name: swin_b
  #   pretrained: imagenet
  #   freeze_encoder: false
  # encoder:
  #   name: dinov3
  #   timm_name: vit_large_patch14_dinov2.lvd142m
  #   freeze_dino: true
  #   lora:
  #     enabled: true
  #     r: 16
  #     alpha: 32.0
  #     target_modules: ["qkv", "proj"]  # 只加在 Attention Q/V/Out 投影
  encoder:
    name: dinov3
    pretrained: imagenet
    timm_name: vit_large_patch16_dinov3.lvd1689m
    out_indices: [2, 9, 16, 23]
    freeze_dino: true
    adapter:
      type: spm_interaction      # CNN pyramid + deformable cross-attn，比 resize 空间质量更好
      channels: 256              # 输出通道数
      spm_stem_channels: 64      # SPM stem 通道数
      interaction_heads: 8       # cross-attn head 数
      interaction_points: 4      # 每个 head 的 deformable 采样点数
      interaction_offset_range: 0.25
      # ViT 各尺度对应的层索引（对应 out_indices 的位置）
      # stride4(细节) → layer0(out_idx=2), stride8 → layer1(10), stride16 → layer2(16), stride32(语义) → layer3(23)
      vit_layer_mapping: [0, 1, 2, 3]
    lora:
      enabled: true
      r: 16
      alpha: 32.0
      target_modules: ["qkv", "proj"]

  decoder:
    type: fpn
    pyramid_channels: 256
    segmentation_channels: 128
    dropout: 0.2
    merge_policy: cat
    separate_detection_fpn: true
    separate_classification_fpn: true
    separate_regression_fpn: true
    use_fpn_for_classification: true
    use_fpn_for_regression: true

  use_film: false
  film:
    use_task_embedding: false
    embedding_dim: 64
    use_affine: true

  task_prompt:
    enabled: false
    channels: 1      # 1 works via broadcasting to RGB input
    prompt_size: 32  # projected low-res prompt, then upsampled to image size
    inject_mode: "concat"  # "add" or "mul" or "concat"
    use_task_name: true     # task_name-only: true, organ-only: false
    use_organ: true         # organ-only: true, task_name-only: false
    use_num_classes: false  # set true to append num_classes one-hot
    init_scale: 0.1
    use_tanh: true

  feature_prompt:
    enabled: false
    condition_source: "task_type_plus_semantic"  # "task_type_only" | "task_type_plus_organ" | "task_type_plus_semantic" | "full_semantic"
    condition_dim: 128
    hidden_dim: 128
    init_scale: 0.1
    # apply_stages: [1, 2, 3, 4]  # optional, supports 1-based or 0-based indexing

  prompt_fpn:
    enabled: true
    decoder_backend: "prompt_fpn"  # "base_fpn" | "prompt_fpn"
    condition_source: "task_type_plus_semantic"  # "task_type_only" | "task_type_plus_organ" | "task_type_plus_semantic" | "full_semantic"
    condition_dim: 128
    hidden_dim: 128
    d_model: 128
    num_prompt_tokens: 4
    num_heads: 4
    ffn_ratio: 4.0
    attn_dropout: 0.1
    ffn_dropout: 0.1
    init_scale: 0.02
    # apply_stages: [3, 4]  # default low-resolution stages only

  heads:
    segmentation:
      type: default
      upsampling: 4
      mid_channels: 128
      num_blocks: 2
      use_deep_supervision: false
      num_aux_outputs: 3
      aux_loss_weights: [0.5, 0.3, 0.2]

    classification:
      type: default
      mid_channels: 256
      dropout: 0.3

    detection:
      type: centernet
      mid_channels: 128
      num_anchors: 1

    regression:
      type: default
      hidden_dims: [256, 128]
      use_tanh: true
      mid_channels: 256
      dropout: 0.3

training:
  num_epochs: 100

  single_task:
    enabled: false
    task_id: ""
    task_name: Detection

  optimizer:
    type: AdamW
    learning_rate: 0.0001
    weight_decay: 0.0001
    use_grouped_lr: true
    encoder_lr_multiplier: 0.1
    head_lr_multiplier: 1.0

  scheduler:
    type: CosineAnnealingLR
    T_max: 100
    eta_min: 1e-6

  loss_weights:
    segmentation: 1.0
    classification: 1.0
    detection: 1.0
    regression: 1.0

  adaptive_loss:
    enabled: false
    init_log_vars: -1.0
    learning_rate: 0.0001
    warmup_epochs: 3

  loss_configs:
    segmentation:
      type: DiceLoss
      mode: multiclass

    classification:
      type: CrossEntropyLoss

    detection:
      type: Centernet
      heatmap_alpha: 2.0
      heatmap_gamma: 4.0
      size_weight: 1.0
      offset_weight: 1.0
      classification_weight: 2.0
      box_regression_weight: 1.0

    regression:
      type: MSELoss

  gradient_clip: 1.0
  accumulation_steps: 1
  print_freq: 100
  log_metrics: true

validation:
  enabled: true
  freq: 1
  save_best_model: true
  metric_for_best: mean_score

device:
  use_cuda: true
  multi_gpu: false
  device_ids: [0]
  mixed_precision: false

