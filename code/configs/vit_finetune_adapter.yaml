# ViT-Large (ImageNet supervised) + Full Finetune + ViT-Adapter (no LoRA)
# Ablation: fully trainable ViT with ViT-Adapter, no freezing
# Purpose: compare full finetune vs freeze+LoRA for ImageNet ViT

experiment:
  name: ViT_finetune_adapter
  seed: 42
  output_dir: outputs/ablation/vit_finetune_adapter
  save_checkpoints: false
  checkpoint_freq: 10

data:
  root_path: "/proj/berzbiomedicalimagingkth/users/x_hujun/Foundation-Model-Challenge-for-Ultrasound-Image-Analysis/dataset/"
  val_split: 0.2
  batch_size: 32
  num_workers: 4
  pin_memory: true
  image_size: 256
  task_type_sampling_weights:
    segmentation: 0.33
    classification: 0.34
    detection: 0.17
    Regression: 0.16
  augmentation:
    train:
      random_brightness_contrast: 0.2
      gauss_noise: 0.1
      horizontal_flip: 0.0
      vertical_flip: 0.0
    normalize:
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

model:
  moe:
    enabled: false

  encoder:
    name: vit_l
    pretrained: imagenet
    timm_name: vit_large_patch16_224
    out_indices: [5, 11, 17, 23]
    freeze_encoder: false            # Full finetune — all ViT params trainable
    adapter:
      type: vit_adapter
      channels: 256
      interaction_indexes: [[0,5],[6,11],[12,17],[18,23]]
      pyramid_pretrained: true
      pyramid_freeze_stages: 1
      interaction_heads: 16
      interaction_points: 4
      interaction_offset_range: 0.25
    lora:
      enabled: false                 # No LoRA — full finetune instead

  decoder:
    type: dpt
    pyramid_channels: 256
    segmentation_channels: 128
    dropout: 0.2
    merge_policy: cat
    separate_detection_fpn: true
    separate_classification_fpn: true
    separate_regression_fpn: true
    use_fpn_for_classification: true
    use_fpn_for_regression: true
    dpt:
      feature_channels: 256
      out_channels: 128

  use_film: false
  film:
    use_task_embedding: false
    embedding_dim: 64
    use_affine: true

  task_prompt:
    enabled: false
  feature_prompt:
    enabled: false
  prompt_fpn:
    enabled: false

  heads:
    segmentation:
      type: default
      upsampling: 4
      mid_channels: 128
      num_blocks: 2
      use_deep_supervision: false
      num_aux_outputs: 3
      aux_loss_weights: [0.5, 0.3, 0.2]
    classification:
      type: default
      mid_channels: 256
      dropout: 0.3
    detection:
      type: centernet
      mid_channels: 128
      num_anchors: 1
    regression:
      type: "dsnt"
      mid_channels: 128
      heatmap_size: [32, 32]
      sigma: 0.07
      reg_weight: 0.5

training:
  num_epochs: 100
  single_task:
    enabled: false
    task_id: ""
    task_name: ""
  optimizer:
    type: AdamW
    learning_rate: 0.0001
    weight_decay: 0.0001
    use_grouped_lr: true
    encoder_lr_multiplier: 0.2       # Lower LR for ViT backbone (full finetune)
    head_lr_multiplier: 1.0
    lora_lr_multiplier: 1.0
  scheduler:
    type: CosineAnnealingLR
    T_max: 100
    eta_min: 1e-6
  loss_weights:
    segmentation: 1.0
    classification: 1.0
    detection: 1.0
    regression: 1.0
  adaptive_loss:
    enabled: false
    init_log_vars: -1.0
    learning_rate: 0.0001
    warmup_epochs: 3
  loss_configs:
    segmentation:
      type: DiceLoss
      mode: multiclass
    classification:
      type: CrossEntropyLoss
    detection:
      type: Centernet
      heatmap_alpha: 2.0
      heatmap_gamma: 4.0
      size_weight: 1.0
      offset_weight: 1.0
      classification_weight: 2.0
      box_regression_weight: 1.0
    regression:
      type: MSELoss
  gradient_clip: 5.0
  accumulation_steps: 1
  print_freq: 100
  log_metrics: true

validation:
  enabled: true
  freq: 1
  save_best_model: true
  metric_for_best: mean_score

device:
  use_cuda: true
  multi_gpu: false
  device_ids: [0]
  mixed_precision: false

